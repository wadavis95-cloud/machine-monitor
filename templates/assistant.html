<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maintenance assistant</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #17283a; background: #edf2f6; }
    main { max-width: 48rem; margin: auto; padding: clamp(1rem, 4vw, 3rem); }
    section, form { background: white; border: 1px solid #d3dfe8; border-radius: .75rem; padding: 1rem; margin: 1rem 0; }
    h2 { margin-top: 0; }
    label, textarea { display: block; }
    textarea { box-sizing: border-box; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; }
    button { font: inherit; padding: .35rem .65rem; }
    .draft-badge { display: inline-block; margin-inline-start: .5rem; border-radius: .4rem; padding: .1rem .45rem; background: #e8eef4; font-size: .875rem; font-weight: 600; }
    .draft-badge[data-status="sent"] { color: #176346; background: #e2f5eb; }
    .draft-badge[data-status="approved"], .draft-badge[data-status="stale"], .draft-changes { color: #754900; }
    .draft-badge[data-status="approved"], .draft-badge[data-status="stale"] { background: #fff1d0; }
    .draft-badge[data-status="send_failed"], .draft-error { color: #a12424; }
    .draft-badge[data-status="send_failed"] { background: #fce9e9; }
    .draft-details { margin-block: .35rem; }
    .draft-actions { display: flex; gap: .5rem; margin-block-start: .4rem; }
    li + li { margin-top: .5rem; }
    #diagram { text-align: center; }
    #diagram svg { max-height: 16rem; }
    #diagram[data-active="model"] .model-node rect,
    #diagram[data-active="tools"] .tools-node rect { fill: #fff1d0 !important; stroke: #945600 !important; stroke-width: 3px; }
    #answer, #steps, #drafts, #tool-calls, pre { white-space: pre-wrap; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main>
    <a href="{{ url_for('dashboard') }}">Back to dashboard</a>
    <h1>Maintenance assistant</h1>
    <form id="question-form">
      <label for="question">Ask about the fleet</label>
      <textarea id="question" maxlength="500" rows="3" required></textarea>
      <button id="ask" type="submit">Ask</button>
      <p id="run-status" role="status"></p>
    </form>

    <section>
      <h2>Run graph</h2>
      <div id="diagram"><pre id="graph-source">{{ graph_source }}</pre></div>
      <ol id="steps" aria-label="Run steps"></ol>
    </section>

    <section>
      <h2>Answer</h2>
      <p id="answer" aria-live="polite"></p>
      <details>
        <summary>How I got this</summary>
        <ol id="tool-calls"></ol>
      </details>
    </section>

    <section>
      <h2>Draft review</h2>
      <p id="draft-status" role="status"></p>
      <ul id="drafts"></ul>
    </section>
  </main>

  <script type="module">
    import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11.12.2/dist/mermaid.esm.min.mjs";

    const diagram = document.getElementById("diagram");
    const source = document.getElementById("graph-source").textContent;
    mermaid.initialize({ startOnLoad: false });
    // Name the graph nodes so CSS can highlight them without redrawing the graph.
    const { svg } = await mermaid.render(
      "assistant-graph", source + "\nclass model model-node;\nclass tools tools-node;"
    );
    diagram.innerHTML = svg;
  </script>
  <script>
    window.addEventListener("DOMContentLoaded", () => {
      const byId = id => document.getElementById(id);
      const question = byId("question");
      const ask = byId("ask");
      const runStatus = byId("run-status");
      const diagram = byId("diagram");
      const steps = byId("steps");
      const answer = byId("answer");
      const toolCalls = byId("tool-calls");
      const drafts = byId("drafts");
      const draftStatus = byId("draft-status");
      let draftRefresh = 0;
      let queue = [];
      const completedDrafts = new Map();
      const activeActions = new Set();
      const actionErrors = new Map();
      const statusLabels = {
        draft: "Draft",
        approved: "Approved · not sent",
        sending: "Sending",
        sent: "Sent",
        rejected: "Rejected",
        stale: "Stale",
        send_failed: "Send failed",
      };

      async function fetchJson(url, options) {
        const response = await fetch(url, options);
        if (!response.ok) {
          const data = await response.json().catch(() => null);
          throw new Error(data?.error || "Request failed. Try again.");
        }
        return response.json();
      }

      function listItem(text) {
        const item = document.createElement("li");
        item.textContent = text;
        return item;
      }

      function renderDrafts() {
        const queuedIds = new Set(queue.map(draft => draft.id));
        const rows = [
          ...queue.map(draft => completedDrafts.get(draft.id) ?? draft),
          ...[...completedDrafts.values()].filter(draft => !queuedIds.has(draft.id)),
        ];
        drafts.replaceChildren(...rows.map(draftRow));
        const detachedError = [...actionErrors].find(([id]) =>
          !queuedIds.has(id) && !completedDrafts.has(id)
        );
        draftStatus.textContent = detachedError?.[1] || (rows.length ? "" : "No drafts to review.");
      }

      async function refreshDrafts() {
        // If two refreshes overlap, only the newest one can update the list.
        const refresh = ++draftRefresh;
        try {
          const pending = await fetchJson("/api/drafts");
          if (refresh !== draftRefresh) return;
          queue = pending;
          renderDrafts();
        } catch (error) {
          if (refresh === draftRefresh) draftStatus.textContent = error.message;
        }
      }

      function changedEvidence(changes = {}) {
        const lines = [];
        const value = item => item ?? "unavailable";
        const keys = (before, after) => new Set([...Object.keys(before), ...Object.keys(after)]);

        if (changes.rul) {
          const { stored, current } = changes.rul;
          lines.push(`Remaining life was ${value(stored)}, now ${value(current)}`);
        }
        if (changes.stock) {
          const { stored, current } = changes.stock;
          for (const part of keys(stored, current)) {
            const before = stored[part] ?? {};
            const after = current[part] ?? {};
            for (const store of keys(before, after)) {
              if (before[store] !== after[store]) {
                lines.push(`${part} (${store}) stock was ${value(before[store])}, now ${value(after[store])}`);
              }
            }
          }
        }
        if (changes.work_orders) {
          const { stored, current } = changes.work_orders;
          for (const id of keys(stored, current)) {
            const before = stored[id];
            const after = current[id];
            if (before?.status !== after?.status) {
              lines.push(`${id} status was ${value(before?.status)}, now ${value(after?.status)}`);
            }
            if (before && after && before.comments !== after.comments) {
              lines.push(`${id} comments changed`);
            }
          }
        }
        return lines;
      }

      async function decideDraft(draft, action) {
        if (activeActions.has(draft.id)) return;
        activeActions.add(draft.id);
        actionErrors.delete(draft.id);
        renderDrafts();
        const url = `/api/drafts/${encodeURIComponent(draft.id)}`;
        try {
          const result = await fetchJson(`${url}/${action}`, { method: "POST" });
          // The approve endpoint uses the EAM's status names on success.
          const status = ["open", "submitted"].includes(result.status) ? "sent" : result.status;
          if (status === "sent" || status === "rejected") {
            // The review queue omits completed drafts. Keep the outcome on this page.
            completedDrafts.set(draft.id, { ...draft, status });
            queue = queue.filter(item => item.id !== draft.id);
            if (status === "sent") {
              try {
                completedDrafts.set(draft.id, await fetchJson(url));
              } catch {
                actionErrors.set(draft.id, "Sent. Could not load the EAM ID.");
              }
            }
          } else {
            queue = queue.map(item => item.id === draft.id ? { ...item, status } : item);
            if (status === "approved" || status === "send_failed") {
              actionErrors.set(draft.id, "Could not send to the EAM. Try again.");
            }
          }
        } catch (error) {
          actionErrors.set(draft.id, error.message);
        } finally {
          activeActions.delete(draft.id);
          renderDrafts();
          await refreshDrafts();
        }
      }

      function draftRow(draft) {
        const summary = draft.kind === "work_order"
          ? `Work order · Engine ${draft.unit} · ${draft.summary}`
          : `Part request · ${draft.qty} × ${draft.part_id} · ${draft.reason}`;
        const row = listItem(`${draft.id.slice(0, 8)}… · ${summary}`);
        const badge = document.createElement("span");
        badge.className = "draft-badge";
        badge.dataset.status = draft.status;
        badge.textContent = statusLabels[draft.status];
        row.append(badge);
        if (draft.status === "sent" && draft.external_id) {
          const externalId = document.createElement("p");
          externalId.className = "draft-details";
          externalId.textContent = `EAM ID ${draft.external_id}`;
          row.append(externalId);
        }

        const changes = changedEvidence(draft.evidence_changes);
        if (changes.length) {
          const evidence = document.createElement("div");
          evidence.className = "draft-details draft-changes";
          const heading = document.createElement("strong");
          heading.textContent = "Changed since draft";
          const list = document.createElement("ul");
          list.append(...changes.map(listItem));
          evidence.append(heading, list);
          row.append(evidence);
        }

        const labels = {
          draft: ["Approve", "Reject"],
          approved: ["Retry"],
          send_failed: ["Retry"],
        }[draft.status];
        if (labels) {
          const actions = document.createElement("div");
          actions.className = "draft-actions";
          for (const label of labels) {
            const button = document.createElement("button");
            button.type = "button";
            button.textContent = label;
            button.disabled = activeActions.has(draft.id);
            button.addEventListener("click", () => decideDraft(draft, label.toLowerCase()));
            actions.append(button);
          }
          row.append(actions);
        }

        const error = actionErrors.get(draft.id);
        if (error) {
          const message = document.createElement("p");
          message.className = "draft-details draft-error";
          message.setAttribute("role", "alert");
          message.textContent = error;
          row.append(message);
        }
        return row;
      }

      function finishRun(message) {
        runStatus.textContent = message;
        diagram.dataset.active = "";
        ask.disabled = false;
      }

      async function pollRun(runId) {
        try {
          const run = await fetchJson(`/api/assistant/runs/${runId}`);
          // Each poll includes the full history. Skip the steps already on screen.
          for (const step of run.steps.slice(steps.children.length)) {
            steps.append(listItem(
              `${step.kind} · ${step.name} ${JSON.stringify(step.args)} · ${step.result || "—"} · ${step.duration_ms} ms`
            ));
            diagram.dataset.active = step.kind === "tool" ? "tools" : "model";
          }
          if (run.status === "running") {
            setTimeout(() => pollRun(runId), 500);
            return;
          }
          answer.textContent = run.answer ?? "";
          toolCalls.replaceChildren(...run.tool_calls.map(call =>
            listItem(`${call.name} ${JSON.stringify(call.args)}`)
          ));
          finishRun(run.status === "error" ? run.error : "Run complete.");
          await refreshDrafts();
        } catch (error) {
          finishRun(error.message);
        }
      }

      byId("question-form").addEventListener("submit", async event => {
        event.preventDefault();
        if (ask.disabled) return;
        ask.disabled = true;
        runStatus.textContent = "Running…";
        diagram.dataset.active = "model";
        steps.replaceChildren();
        toolCalls.replaceChildren();
        answer.textContent = "";
        try {
          const { run_id } = await fetchJson("/api/assistant", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ question: question.value }),
          });
          await pollRun(run_id);
        } catch (error) {
          finishRun(error.message);
        }
      });

      return refreshDrafts();
    });
  </script>
</body>
</html>
